<section id="contact" class="contact-section">
    <div class="container">
        <div class="section-header fade-in">
            <h2 class="section-title">Contacts</h2>
            <p class="section-subtitle">Un projet ? Parlons-en.</p>
        </div>
        <div class="row">
            <div class="col-lg-5 mb-4">
                <div class="contact-intro fade-in">
                    <h3>Vous avez un projet ?<br>Parlons-en !</h3>
                    <a href="mailto:romarioeugene4@gmail.com" class="btn btn-primary mt-3">Écrire</a>
                </div>
            </div>
            <div class="col-lg-7">
                <div class="contact-form fade-in">
                    <form action="https://formspree.io/f/xeelezwz" method="POST" id="contactForm">
                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <input type="text" class="form-control" name="name" id="name" placeholder="Nom *" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <input type="email" class="form-control" name="_replyto" id="email" placeholder="Email *" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <input type="text" class="form-control" name="subject" id="subject" placeholder="Sujet *" required>
                        </div>
                        <div class="mb-4">
                            <textarea class="form-control" name="message" id="message" rows="5" placeholder="Message *" required></textarea>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                                Envoyer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <div class="row mt-4">
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="contact-info fade-in">
                    <div class="contact-icon"><i class="fas fa-at"></i></div>
                    <h5>Email</h5>
                    <p>romarioeugene4@gmail.com</p>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="contact-info fade-in">
                    <div class="contact-icon"><i class="fas fa-phone-alt"></i></div>
                    <h5>Téléphone</h5>
                    <p>+261 33 28 996 78</p>
                </div>
            </div>
            <div class="col-lg-4 col-md-6 mb-4">
                <div class="contact-info fade-in">
                    <div class="contact-icon"><i class="fas fa-globe-africa"></i></div>
                    <h5>Localisation</h5>
                    <p>Madagascar</p>
                </div>
            </div>
        </div>
    </div>
</section>
